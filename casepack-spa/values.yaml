# Default values for casepack-spa

replicaCount: 1

image:
  repository: ghcr.io/sammyeby/casepack-spa
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart appVersion

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

# Runtime configuration injected as environment variables
# These are written to /usr/share/nginx/html/config.js at container startup
config:
  apiBaseUrl: "/api"
  oidcAuthority: ""
  oidcClientId: "casepack-spa"
  licensingPortalUrl: "https://licensing.samuelumeh.com/portal"
  deploymentMode: "SAAS"
  appVersion: ""
  docsBaseUrl: "https://docs.casepack.app"
  # Umami analytics. Leave both empty to disable (default — keeps self-host
  # deployments from phoning home). Set both on the SAAS deployment to enable.
  umamiScriptUrl: ""
  umamiWebsiteId: ""
  # Optional comma-separated hostnames to scope tracking to (e.g. "casepack.app").
  # Umami's tracker only reports from these hostnames, so a non-prod environment
  # that inherits the prod website id still won't pollute prod analytics.
  umamiDomains: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101    # nginx user
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: casepack.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Nginx server config override (the whole default.conf).
# Leave empty to use the config built into the image, which serves the
# prerendered marketing pages, falls back to the noindex app shell for app
# routes, and sends the security/cache headers and /healthz. An override
# replaces all of that, so only set it if you reproduce that behaviour.
nginxConfig: ""
