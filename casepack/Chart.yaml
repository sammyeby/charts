apiVersion: v2
name: casepack
description: >-
  CasePack — multi-tenant incident evidence management platform for MSPs.
  Deploys the full stack in one command.
type: application
version: 0.8.4
appVersion: "0.8.4"
home: https://casepack.app
icon: https://casepack.app/apple-touch-icon.png
sources:
  - https://github.com/sammyeby/casepack
keywords:
  - casepack
  - incident-reporting
  - incident-management
  - evidence
  - nis2
  - msp
  - multi-tenant
  - keycloak
  - seaweedfs
  - self-host
maintainers:
  - name: SamSoft Technologies
    url: https://github.com/sammyeby
annotations:
  artifacthub.io/license: Proprietary
  artifacthub.io/category: security

dependencies:
  # ── Core Application ───────────────────────────────────────────
  - name: casepack-api
    version: "0.35.0"
    repository: "oci://ghcr.io/sammyeby/charts"

  - name: casepack-spa
    version: "0.34.0"
    repository: "oci://ghcr.io/sammyeby/charts"

  # ── Infrastructure (optional — disable if using external services) ─
  - name: postgresql
    version: "2.3.2"
    repository: "oci://ghcr.io/sammyeby/charts"
    condition: postgresql.enabled

  - name: keycloak
    version: "1.4.1"
    repository: "oci://ghcr.io/sammyeby/charts"
    condition: keycloak.enabled

  - name: gotenberg
    version: "0.2.0"
    repository: "oci://ghcr.io/sammyeby/charts"
    condition: gotenberg.enabled

  - name: seaweedfs
    version: "4.34.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
